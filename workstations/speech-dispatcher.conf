# spark-9667: retain factory settings and the currently working speech modules.
# Explicit selection avoids auto-loading the failing optional MBROLA backend.
Include "/etc/speech-dispatcher/speechd.conf"
AddModule "espeak-ng" "/usr/lib/speech-dispatcher-modules/sd_espeak-ng" "/etc/speech-dispatcher/modules/espeak-ng.conf"
AddModule "openjtalk" "/usr/lib/speech-dispatcher-modules/sd_openjtalk" "/etc/speech-dispatcher/modules/openjtalk.conf"
AddModule "dummy" "/usr/lib/speech-dispatcher-modules/sd_dummy" ""
DefaultModule espeak-ng
